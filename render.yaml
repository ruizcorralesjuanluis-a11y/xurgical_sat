services:
  - type: web
    name: xurgical-sat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xurgical-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: xurgical-db
    plan: free
    region: oregon # or your preferred region
