
services:
  - type: web
    name: xurgical-sat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: XURGICAL_DB_PATH
        value: /tmp/sat.db  # Use ephemeral /tmp for demo purposes. Switch to a persistent disk or PostgreSQL for production.
