# Trigger: 2026-02-11 18:32
services:
  - type: web
    name: xurgical-sat
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_FORCE_REDEPLOY
        value: "v3"
