services:
  - type: web
    name: xurgical-sat
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Aquí pegarás la URL de Neon en el panel de Render
      - key: SECRET_KEY
        generateValue: true
      - key: TRIGGER_DEPLOY_LABEL
        value: "v2"
