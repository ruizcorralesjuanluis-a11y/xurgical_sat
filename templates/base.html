<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Xurgical SAT</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      min-height:100vh;
      background: url("/static/bg.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* Barra superior tipo "ventana" */
    .topbar{
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      padding: 14px 18px;
      margin-top: 18px;
    }

    /* Ventana principal */
    .window{
      background: rgba(255,255,255,0.90);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      box-shadow: 0 12px 36px rgba(0,0,0,.20);
      padding: 22px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color: inherit;
    }
    .brand img{ height:46px; }
    .brand .title{ font-weight:700; font-size: 20px; line-height:1; }
    .brand .sub{ font-size:12px; color:#6c757d; }

    /* Tarjetas más “pro” */
    .card{
      border: 0;
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
    }

    /* Tabla suave */
    .table thead th{
      color:#6c757d;
      font-weight:600;
      border-top:0;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="topbar d-flex align-items-center justify-content-between">
      <a class="brand" href="/">
        <img src="/static/logo-xurgical.png" alt="Xurgical"/>
        <div>
          <div class="title">Xurgical SAT</div>
          <div class="sub">Dashboard v2</div>
        </div>
      </a>

      {% if user %}
      <div class="d-flex align-items-center gap-2">
        <span class="badge text-bg-dark">{{ user.username }}</span>
        <span class="badge text-bg-secondary">{{ user.role }}</span>
        <form method="post" action="/logout" class="m-0">
          <button class="btn btn-sm btn-danger">Salir</button>
        </form>
      </div>
      {% endif %}
    </div>

    <main class="my-4">
      <div class="window">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</body>
</html>
