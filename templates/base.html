<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Xurgical SAT</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/premium.css">

  <style>
    body {
        min-height: 100vh;
        background: url("/static/bg.jpg") no-repeat center center fixed;
        background-size: cover;
    }

    .glass-nav {
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem 0;
        margin-bottom: 2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        border-radius: 0 0 20px 20px;
    }

    .window-premium {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
    }

    .brand-premium {
        display: flex;
        align-items: center;
        gap: 1rem;
        text-decoration: none !important;
    }

    .brand-premium .title {
        color: white;
        font-weight: 700;
        font-size: 1.25rem;
        margin: 0;
    }

    .badge-user {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.4rem 0.8rem;
        border-radius: 99px;
        color: white;
        font-weight: 500;
        font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="topbar d-flex align-items-center justify-content-between">
      <a class="brand" href="/">
        <img src="/static/logo-xurgical.png" alt="Xurgical"/>
        <div>
          <div class="title">Xurgical SAT</div>
          <div class="sub">Dashboard v2</div>
        </div>
      </a>

      {% if user %}
      <div class="d-flex align-items-center gap-2">
        <span class="badge text-bg-dark">{{ user.username }}</span>
        <span class="badge text-bg-secondary">{{ user.role }}</span>
        <form method="post" action="/logout" class="m-0">
          <button class="btn btn-sm btn-danger">Salir</button>
        </form>
      </div>
      {% endif %}
    </div>

    <main class="my-4">
      <div class="window">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>
</body>
</html>
