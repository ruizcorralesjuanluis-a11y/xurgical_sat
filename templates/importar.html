<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Importar Excel · Xurgical SAT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="/">← Dashboard</a>
  </div>
</nav>

<main class="container py-4">
  <h1 class="h4 mb-3">Importar Excel</h1>

  <div class="card">
    <div class="card-body">
      <form action="/importar" method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label">Tipo de parte</label>
          <select class="form-select" name="tipo_trabajo" required>
            <option value="REPARACION" selected>Reparación</option>
            <option value="OPTICA_RIGIDA">Óptica rígida</option>
            <option value="TRAZABILIDAD">Trazabilidad</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Selecciona el archivo .xlsx</label>
          <input class="form-control" type="file" name="file" accept=".xlsx" required>
        </div>
        <button class="btn btn-primary">Importar</button>
      </form>
      <div class="text-secondary small mt-3">
        Consejo: usa tu plantilla habitual (con columna “CODIGO PRODUCTO”).
      </div>
    </div>
  </div>
</main>
</body>
</html>
