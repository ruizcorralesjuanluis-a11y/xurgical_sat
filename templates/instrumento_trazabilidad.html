<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trazabilidad - Introducir instrumento</title>

  <!-- Si ya lo tienes cargado en base.html, quítalo -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    video { width: 100%; max-height: 380px; background: #000; border-radius: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>

<body>
<div class="container py-3">

  <h4 class="mb-3">Trazabilidad – Introducir instrumento</h4>

  <!-- =========================
       CAMARA
  ========================= -->
  <div class="card mb-3">
    <div class="card-body">

      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <label class="form-label" for="cameraSelect">Cámara</label>
          <select id="cameraSelect" class="form-select"></select>
          <div class="form-text">
            Si solo ves “Cámara 1”, prueba el botón “Cambiar cámara” o entra por <span class="mono">http://localhost</span>.
          </div>
        </div>

        <div class="col-md-2">
          <button id="btnStart" type="button" class="btn btn-primary w-100">Iniciar</button>
        </div>

        <div class="col-md-2">
          <button id="btnStop" type="button" class="btn btn-outline-secondary w-100">Parar</button>
        </div>

        <div class="col-md-2">
          <button id="btnToggleFacing" type="button" class="btn btn-outline-primary w-100">Cambiar cámara</button>
        </div>
      </div>

      <div class="mt-3">
        <video id="video" playsinline autoplay muted></video>
      </div>

      <small id="cam_hint" class="text-muted d-block mt-2"></small>

    </div>
  </div>

  <!-- =========================
       FORMULARIO INSTRUMENTO
       (ajusta name/id si en tu backend usas otros)
  ========================= -->
  <form method="post" id="frmInstrumento">

    <div class="card mb-3">
      <div class="card-body">

        <div class="row g-2">
          <div class="col-md-3">
            <label class="form-label" for="codigo">Código</label>
            <input id="codigo" name="codigo" class="form-control mono" autocomplete="off" placeholder="06-LCC11" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="descripcion">Descripción</label>
            <input id="descripcion" name="descripcion" class="form-control" autocomplete="off">
          </div>

          <div class="col-md-3">
            <label class="form-label" for="fabricante">Fabricante</label>
            <input id="fabricante" name="fabricante" class="form-control" autocomplete="off">
          </div>
        </div>

        <small id="lookup_hint" class="text-muted d-block mt-2"></small>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-success">Guardar</button>
          <a href="/" class="btn btn-secondary">Volver</a>
        </div>

      </div>
    </div>

  </form>

</div>

<script>
(function () {
  // =========================
  // ELEMENTOS
  // =========================
  const video = document.getElementById("video");
  const cameraSelect = document.getElementById("cameraSelect");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");
  const btnToggleFacing = document.getElementById("btnToggleFacing");
  const camHint = document.getElementById("cam_hint");

  const frm = document.getElementById("frmInstrumento");
  const codigoEl = document.getElementById("codigo");
  const descEl = document.getElementById("descripcion");
  const fabEl = document.getElementById("fabricante");
  const hintEl = document.getElementById("lookup_hint");

  // =========================
  // ESTADO
  // =========================
  let stream = null;
  let debounceTimer = null;
  let facingMode = "environment"; // fallback toggle: environment <-> user

  function camMsg(msg) { if (camHint) camHint.textContent = msg || ""; }
  function msg(msg) { if (hintEl) hintEl.textContent = msg || ""; }

  // =========================
  // CAMARA: start/stop + listar
  // =========================
  async function stopStream() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (video) video.srcObject = null;
  }

  async function startStreamByDeviceId(deviceId) {
    await stopStream();
    const constraints = {
      audio: false,
      video: deviceId
        ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
        : { width: { ideal: 1280 }, height: { ideal: 720 } }
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
  }

  async function startStreamByFacingMode() {
    await stopStream();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
  }

  async function loadCameras() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      cameraSelect.innerHTML = '<option value="">Navegador sin enumerateDevices()</option>';
      return 0;
    }

    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === "videoinput");

    cameraSelect.innerHTML = "";
    if (cams.length === 0) {
      cameraSelect.innerHTML = '<option value="">No se detectan cámaras</option>';
      return 0;
    }

    cams.forEach((c, idx) => {
      const opt = document.createElement("option");
      opt.value = c.deviceId;
      opt.textContent = c.label ? c.label : `Cámara ${idx + 1}`;
      cameraSelect.appendChild(opt);
    });

    return cams.length;
  }

  cameraSelect.addEventListener("change", async () => {
    const id = cameraSelect.value;
    try {
      await startStreamByDeviceId(id);
      camMsg("Cámara cambiada ✅");
    } catch (e) {
      console.warn(e);
      camMsg("No se pudo cambiar por deviceId. Prueba “Cambiar cámara”.");
    }
  });

  btnStart.addEventListener("click", async () => {
    try {
      // 1) Pide permiso iniciando cámara (necesario para ver labels)
      await startStreamByFacingMode();

      // 2) Lista cámaras ya con permisos
      const n = await loadCameras();

      // 3) Si hay varias, intenta arrancar con la primera del select
      if (n > 0 && cameraSelect.value) {
        try { await startStreamByDeviceId(cameraSelect.value); } catch(e) {}
      }

      camMsg("Cámara iniciada ✅");
    } catch (e) {
      console.warn(e);
      camMsg("No se pudo iniciar la cámara (permiso denegado o navegador).");
    }
  });

  btnStop.addEventListener("click", async () => {
    await stopStream();
    camMsg("Cámara parada");
  });

  btnToggleFacing.addEventListener("click", async () => {
    facingMode = (facingMode === "environment") ? "user" : "environment";
    try {
      await startStreamByFacingMode();
      camMsg(`Cambio por facingMode: ${facingMode} ✅`);
      // actualiza lista si puede
      try { await loadCameras(); } catch(e) {}
    } catch (e) {
      console.warn(e);
      camMsg("No se pudo cambiar por facingMode.");
    }
  });

  // =========================
  // AUTORRELLENO
  // =========================
  function normCode(s) {
    if (!s) return "";
    let t = String(s).trim();
    t = t.replace(/^(rp|mt)\s*/i, "");
    return t.toUpperCase();
  }

  async function lookupArticulo() {
    const codigo = normCode(codigoEl.value);
    if (!codigo) return;

    msg("Buscando artículo...");

    try {
      const res = await fetch(`/articulos_lookup?codigo=${encodeURIComponent(codigo)}`, { cache: "no-store" });
      if (!res.ok) { msg(`Error HTTP ${res.status}`); return; }

      const data = await res.json();
      if (data && data.found) {
        // Rellena solo si el campo está vacío para no pisar al técnico
        if (descEl && !descEl.value.trim()) descEl.value = data.descripcion || "";
        if (fabEl && !fabEl.value.trim()) fabEl.value = data.fabricante || "";
        msg("Autorrellenado desde Articulos.xlsx ✓");
      } else {
        msg("No encontrado en Articulos.xlsx");
      }
    } catch (e) {
      console.warn(e);
      msg("Error de red al buscar el artículo");
    }
  }

  // ✅ CRÍTICO: evitar que ENTER envíe el form (lo que “hace desaparecer” el panel/menú)
  codigoEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      e.stopPropagation();
      lookupArticulo();
    }
  });

  codigoEl.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(lookupArticulo, 200);
  });
  codigoEl.addEventListener("blur", lookupArticulo);

  // EXTRA: evita submit accidental por teclado en toda la página
  frm.addEventListener("submit", (e) => {
    // Si quieres permitir submit normal, comenta estas 2 líneas:
    // e.preventDefault();
    // return false;
  });

  // Carga inicial: lista cámaras (labels pueden salir vacías hasta pedir permisos)
  document.addEventListener("DOMContentLoaded", async () => {
    try { await loadCameras(); } catch(e) {}
    camMsg("Pulsa “Iniciar” para dar permisos y listar cámaras.");
  });

})();
</script>

</body>
</html>
